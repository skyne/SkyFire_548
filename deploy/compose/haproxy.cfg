global
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    log global

frontend auth_in
    bind *:3724
    default_backend auth_out

backend auth_out
    option tcp-check
    server auth sf-authserver:3724 check

frontend world_in
    bind *:8085
    default_backend gateway_out

backend gateway_out
    option tcp-check
    server gateway sf-clustergateway:8085 check send-proxy-v2
