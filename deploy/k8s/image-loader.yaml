apiVersion: v1
kind: Pod
metadata:
  name: image-loader
  namespace: skyfire
spec:
  restartPolicy: Never
  hostPID: true
  containers:
    - name: loader
      image: busybox:1.36.1
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /
