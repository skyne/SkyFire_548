# One StatefulSet per disjoint map-id pack. Never two owners of the same map.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: world-oldworld
  namespace: skyfire
spec:
  serviceName: world-oldworld
  replicas: 1
  selector:
    matchLabels:
      app: worldserver
      role: oldworld
  template:
    metadata:
      labels:
        app: worldserver
        role: oldworld
    spec:
      containers:
        - name: worldserver
          image: skyfire/548-worldserver:local
          env:
            - name: SF_CLUSTER_ENABLED
              value: "1"
            - name: SF_CLUSTER_NATS_URL
              value: "nats://nats:4222"
            - name: SF_CLUSTER_NODE_ID
              value: "1"
            - name: SF_CLUSTER_AVAILABLE_MAPS
              value: "0,1"
            - name: SF_CLUSTER_HIDE_WORLD_PORT
              value: "1"
            - name: SF_CLUSTER_LINK_BIND_IP
              value: "0.0.0.0"
            - name: SF_CLUSTER_ADVERTISED_HOST
              value: world-oldworld-0.world-oldworld
            - name: SF_CLUSTER_SHARED_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: skyfire-cluster
                  key: CLUSTER_TOKEN
          ports:
            - containerPort: 8086
              name: clusterlink
---
apiVersion: v1
kind: Service
metadata:
  name: world-oldworld
  namespace: skyfire
spec:
  clusterIP: None
  selector:
    app: worldserver
    role: oldworld
  ports:
    - name: clusterlink
      port: 8086
---
