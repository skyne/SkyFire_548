# Layer 1 HA: TCP LoadBalancer on 8085. Not HTTP Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clustergateway
  namespace: skyfire
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clustergateway
  template:
    metadata:
      labels:
        app: clustergateway
    spec:
      containers:
        - name: clustergateway
          image: skyfire/548-clustergateway:local
          ports:
            - containerPort: 8085
              name: world
          env:
            - name: SF_GATEWAY_PROXY_PROTOCOL
              value: "0"
            - name: SF_CLUSTER_SHARED_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: skyfire-cluster
                  key: CLUSTER_TOKEN
          readinessProbe:
            tcpSocket:
              port: 8085
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: clustergateway
  namespace: skyfire
spec:
  type: LoadBalancer
  selector:
    app: clustergateway
  ports:
    - name: world
      port: 8085
      targetPort: 8085
      protocol: TCP
  sessionAffinity: None
