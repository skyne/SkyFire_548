# One run per push: build once with PCH, publish images from that build, then
# roll the skyfire namespace. Each image is tagged with the first 12 characters
# of the commit sha, so a new build never reuses the previous tag.
#
# Deploy reaches the cluster over Tailscale. Add these before turning it on:
#   secret  TAILSCALE_AUTHKEY   reusable, ephemeral auth key for the tailnet
#   secret  KUBECONFIG          contents of the k3s kubeconfig (server must be the Tailscale API address)
#   variable SKYFIRE_DEPLOY     set to true to roll out on every push to main
#
# A manual run can deploy without that variable. Pull requests compile and stop
# before any image is published.

name: ubuntu-build

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Roll the new images onto the skyfire cluster
        type: boolean
        default: true
  push:
    branches: [ main, trunk ]
    paths-ignore:
      - 'sql/**'
  pull_request:
    branches: [ main, trunk ]
    paths-ignore:
      - 'sql/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  BUILD_TYPE: Release
  BOOST_VERSION: 1.91.0
  OPENSSL_VERSION: 4.0.0
  DEPS_DIR: ${{ github.workspace }}/.deps
  BOOST_ROOT: ${{ github.workspace }}/.deps/boost_1_91_0
  OPENSSL_ROOT_DIR: ${{ github.workspace }}/.deps/openssl-4.0.0
  BUILD_DIR: ${{ github.workspace }}/build/ubuntu
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CC: gcc-14
  CXX: g++-14

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 420

    steps:
    - uses: actions/checkout@v4

    - name: Set image tag
      shell: bash
      run: |
        set -euo pipefail
        tag="${GITHUB_SHA:0:12}"
        echo "IMAGE_TAG=${tag}" >> "$GITHUB_ENV"
        echo "Images will be tagged ${tag}"

    - name: Check game source tabs
      shell: pwsh
      run: ./tools/dev/game_metrics.ps1 -CheckNoTabs

    - name: Install Ubuntu dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ca-certificates \
          ccache \
          cmake \
          git \
          libbz2-dev \
          libreadline-dev \
          ninja-build \
          perl \
          pkg-config \
          wget \
          zlib1g-dev

        sudo apt-get install -y default-libmysqlclient-dev || sudo apt-get install -y libmysqlclient-dev

    - name: Verify compiler toolchain
      shell: bash
      run: |
        set -euo pipefail
        command -v "$CC"
        command -v "$CXX"
        "$CC" --version
        "$CXX" --version

    - name: Cache Boost
      id: boost-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.BOOST_ROOT }}
        key: ubuntu-boost-${{ env.BOOST_VERSION }}

    - name: Install Boost
      if: steps.boost-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$DEPS_DIR"
        boost_archive="$RUNNER_TEMP/boost_1_91_0.tar.gz"
        wget -q "https://archives.boost.io/release/$BOOST_VERSION/source/boost_1_91_0.tar.gz" -O "$boost_archive"
        tar -xzf "$boost_archive" -C "$RUNNER_TEMP"
        cd "$RUNNER_TEMP/boost_1_91_0"
        ./bootstrap.sh
        ./b2 install --prefix="$BOOST_ROOT" --with-headers -j"$(nproc)"

    - name: Cache OpenSSL
      id: openssl-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.OPENSSL_ROOT_DIR }}
        key: ubuntu-openssl-${{ env.OPENSSL_VERSION }}

    - name: Install OpenSSL
      if: steps.openssl-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$DEPS_DIR"
        openssl_archive="$RUNNER_TEMP/openssl-$OPENSSL_VERSION.tar.gz"
        wget -q "https://www.openssl.org/source/openssl-$OPENSSL_VERSION.tar.gz" -O "$openssl_archive"
        tar -xzf "$openssl_archive" -C "$RUNNER_TEMP"
        cd "$RUNNER_TEMP/openssl-$OPENSSL_VERSION"
        ./Configure linux-x86_64 \
          --prefix="$OPENSSL_ROOT_DIR" \
          --openssldir="$OPENSSL_ROOT_DIR/ssl" \
          shared \
          enable-legacy
        make -j"$(nproc)"
        make install_sw install_ssldirs

    - name: Export dependency paths
      shell: bash
      run: |
        echo "$OPENSSL_ROOT_DIR/bin" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=$OPENSSL_ROOT_DIR/lib64:$OPENSSL_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ubuntu-ccache-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ubuntu-ccache-${{ github.ref_name }}-
          ubuntu-ccache-

    - name: Configure with PCH
      shell: bash
      run: |
        set -euo pipefail
        cmake -S "$GITHUB_WORKSPACE" -B "$BUILD_DIR" -G Ninja \
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
          -DCMAKE_C_COMPILER="$CC" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DTOOLS=ON \
          -DPACKET_LOG_SERVER=ON \
          -DUSE_COREPCH=ON \
          -DUSE_SCRIPTPCH=ON \
          -DSKYFIRE_BUILD_TESTS=OFF \
          -DBOOST_ROOT="$BOOST_ROOT" \
          -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"

    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        cmake --build "$BUILD_DIR" --parallel "$(nproc)"

    - name: PCH smoke
      shell: bash
      run: |
        set -euo pipefail
        cache="$BUILD_DIR/CMakeCache.txt"
        grep -q '^USE_COREPCH:BOOL=ON$' "$cache"
        grep -q '^USE_SCRIPTPCH:BOOL=ON$' "$cache"
        for bin in \
          "$BUILD_DIR/src/server/authserver/authserver" \
          "$BUILD_DIR/src/server/worldserver/worldserver" \
          "$BUILD_DIR/src/server/clustergateway/clustergateway" \
          "$BUILD_DIR/src/tools/packet_log_server/packetlogserver"
        do
          test -x "$bin"
        done

    - name: Check module discovery and installation
      shell: bash
      run: python3 tools/dev/test_module_configuration.py

    - name: Image names
      id: names
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
        echo "owner=${owner}" >> "$GITHUB_OUTPUT"

    - name: Stage image root
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        BUILD="$BUILD_DIR" OPENSSL="$OPENSSL_ROOT_DIR" bash deploy/docker/stage-image.sh

    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push images
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        set -euo pipefail
        owner="${{ steps.names.outputs.owner }}"
        for target in authserver worldserver clustergateway; do
          image="ghcr.io/${owner}/skyfire-${target}:${IMAGE_TAG}"
          docker build -f deploy/docker/Dockerfile --target "$target" -t "$image" .
          docker push "$image"
        done

    - name: Join the tailnet
      if: >-
        (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
        (github.event_name == 'push' && vars.SKYFIRE_DEPLOY == 'true')
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    - name: Resolve the API host
      if: >-
        (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
        (github.event_name == 'push' && vars.SKYFIRE_DEPLOY == 'true')
      shell: bash
      run: |
        set -euo pipefail
        ip=""
        for _ in $(seq 1 20); do
          ip=$(tailscale status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); peers=(d.get("Peer") or {}).values(); print(next((p["TailscaleIPs"][0] for p in peers if "ailab" in (((p.get("DNSName") or "")+" "+(p.get("HostName") or "")).lower()) and p.get("TailscaleIPs")), ""))' || true)
          if [ -n "$ip" ]; then
            break
          fi
          sleep 2
        done
        if [ -z "$ip" ]; then
          echo "ailab is not visible on the tailnet" >&2
          tailscale status >&2 || true
          exit 1
        fi
        grep -q 'ailab.tail0b303.ts.net' /etc/hosts || echo "$ip ailab.tail0b303.ts.net" | sudo tee -a /etc/hosts >/dev/null
        getent hosts ailab.tail0b303.ts.net

    - name: Install kubectl
      if: >-
        (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
        (github.event_name == 'push' && vars.SKYFIRE_DEPLOY == 'true')
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl"
        sudo install -m 0755 kubectl /usr/local/bin/kubectl

    - name: Write kubeconfig
      if: >-
        (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
        (github.event_name == 'push' && vars.SKYFIRE_DEPLOY == 'true')
      shell: bash
      env:
        KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
      run: |
        set -euo pipefail
        if [ -z "$KUBECONFIG_CONTENT" ]; then
          echo "KUBECONFIG secret is empty" >&2
          exit 1
        fi
        mkdir -p "$HOME/.kube"
        printf '%s\n' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
        chmod 600 "$HOME/.kube/config"

    - name: Give the node a pull secret
      if: >-
        (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
        (github.event_name == 'push' && vars.SKYFIRE_DEPLOY == 'true')
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail
        kubectl -n skyfire delete pod image-loader --ignore-not-found --wait=false
        kubectl -n skyfire create secret docker-registry ghcr-pull \
          --docker-server=ghcr.io \
          --docker-username="$GH_ACTOR" \
          --docker-password="$GH_TOKEN" \
          --dry-run=client -o yaml | kubectl -n skyfire apply -f -
        kubectl -n skyfire delete pod image-loader --ignore-not-found --wait=true
        python3 -c 'open("/tmp/loader.yaml","w").write("apiVersion: v1\nkind: Pod\nmetadata:\n  name: image-loader\n  namespace: skyfire\nspec:\n  restartPolicy: Never\n  hostPID: true\n  containers:\n    - name: loader\n      image: busybox:1.36.1\n      command: [\"sleep\", \"180\"]\n      securityContext:\n        privileged: true\n      volumeMounts:\n        - name: host\n          mountPath: /host\n  volumes:\n    - name: host\n      hostPath:\n        path: /\n")'
        kubectl -n skyfire apply -f /tmp/loader.yaml
        kubectl -n skyfire wait --for=condition=Ready pod/image-loader --timeout=180s
        for target in authserver worldserver clustergateway; do
          kubectl -n skyfire exec image-loader -- chroot /host /usr/local/bin/k3s ctr -n k8s.io images rm "ghcr.io/${{ steps.names.outputs.owner }}/skyfire-${target}:${IMAGE_TAG}" || true
        done
        kubectl -n skyfire delete pod image-loader --wait=false

    - name: Roll the realm
      if: >-
        (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
        (github.event_name == 'push' && vars.SKYFIRE_DEPLOY == 'true')
      shell: bash
      run: |
        set -euo pipefail
        owner="${{ steps.names.outputs.owner }}"
        ns=skyfire
        tag="${IMAGE_TAG}"

        pod_busy() {
          local pod="$1" hex="$2"
          kubectl -n "$ns" exec "$pod" -- awk -v p="$hex" '
            NR > 1 {
              n = split($2, a, ":")
              if (n >= 2 && toupper(a[2]) == p && $4 == "01") found = 1
            }
            END { exit !found }
          ' /proc/net/tcp /proc/net/tcp6 || return 1
        }

        retire_when_idle() {
          local pod="$1" hex="$2"
          local i=0
          while pod_busy "$pod" "$hex"; do
            i=$((i + 1))
            if [ "$i" -ge 60 ]; then
              echo "$pod still has players; leaving it running"
              return 0
            fi
            sleep 10
          done
          kubectl -n "$ns" delete pod "$pod" --wait=false
          echo "drained $pod"
        }

        roll_front() {
          local name="$1" port="$2"
          local image="ghcr.io/${owner}/skyfire-${name}:${tag}"
          local hex
          hex=$(printf '%04X' "$port")

          kubectl -n "$ns" rollout resume "deploy/${name}" || true
          kubectl -n "$ns" get pods -l "app=${name}-draining" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | while read -r old; do
            [ -n "$old" ] || continue
            retire_when_idle "$old" "$hex"
          done

          drain=$(printf '%s' "hex=\$(printf %04X ${port}); while awk -v p=\"\$hex\" 'NR>1 { split(\$2,a,\":\"); if (toupper(a[2])==toupper(p) && \$4==\"01\") e=1 } END { exit !e }' /proc/net/tcp /proc/net/tcp6; do sleep 5; done")
          NAME="$name" IMAGE="$image" DRAIN="$drain" python3 -c 'import json,os; print(json.dumps({"spec":{"minReadySeconds":600,"progressDeadlineSeconds":86400,"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}},"template":{"spec":{"terminationGracePeriodSeconds":86400,"imagePullSecrets":[{"name":"ghcr-pull"}],"containers":[{"name":os.environ["NAME"],"image":os.environ["IMAGE"],"imagePullPolicy":"Always","lifecycle":{"preStop":{"exec":{"command":["bash","-c",os.environ["DRAIN"]]}}}}]}}}}))' > /tmp/front-patch.json
          kubectl -n "$ns" patch "deploy/${name}" --type=strategic --patch-file /tmp/front-patch.json

          local deadline=$((SECONDS + 900))
          local fresh=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            fresh=$(kubectl -n "$ns" get pods -l "app=${name}" -o jsonpath="{range .items[?(@.status.containerStatuses[0].ready)]}{.metadata.name}{' '}{.spec.containers[0].image}{'\n'}{end}" | awk -v image="$image" '$2==image { print $1; exit }')
            if [ -n "$fresh" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$fresh" ]; then
            echo "new ${name} pod did not become ready" >&2
            kubectl -n "$ns" get pods -l "app=${name}" -o wide >&2 || true
            kubectl -n "$ns" describe "deploy/${name}" >&2 | tail -n 40 || true
            exit 1
          fi
          kubectl -n "$ns" rollout pause "deploy/${name}" || true

          kubectl -n "$ns" get pods -l "app=${name}" -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.containers[0].image}{"\n"}{end}' | while read -r pod image_now; do
            [ "$image_now" = "$image" ] && continue
            kubectl -n "$ns" patch pod "$pod" --type=json -p='[{"op":"remove","path":"/metadata/ownerReferences"}]' || true
            kubectl -n "$ns" label pod "$pod" "app=${name}-draining" --overwrite
            retire_when_idle "$pod" "$hex"
          done
          kubectl -n "$ns" rollout resume "deploy/${name}" || true
        }

        roll_world() {
          local role="$1"
          local image="ghcr.io/${owner}/skyfire-worldserver:${tag}"
          local pod="world-${role}-0"
          if pod_busy "$pod" "1F96"; then
            echo "world-${role} has players connected; keeping the current process"
            return 0
          fi
          kubectl -n "$ns" set image "statefulset/world-${role}" "worldserver=${image}"
          kubectl -n "$ns" patch "statefulset/world-${role}" --type=strategic \
            -p '{"spec":{"template":{"spec":{"terminationGracePeriodSeconds":86400,"imagePullSecrets":[{"name":"ghcr-pull"}],"containers":[{"name":"worldserver","imagePullPolicy":"Always"}]}}}}'
          kubectl -n "$ns" rollout status "statefulset/world-${role}" --timeout=300s
        }

        roll_front authserver 3724
        roll_front clustergateway 8085
        for role in oldworld outland northrend pandaria bg; do
          roll_world "$role"
        done
        for name in authserver clustergateway; do
          kubectl -n "$ns" patch "deploy/${name}" --type=strategic -p "{\"spec\":{\"minReadySeconds\":0,\"template\":{\"spec\":{\"containers\":[{\"name\":\"${name}\",\"imagePullPolicy\":\"IfNotPresent\"}]}}}}"
          kubectl -n "$ns" rollout status "deploy/${name}" --timeout=300s
        done
        for role in oldworld outland northrend pandaria bg; do
          kubectl -n "$ns" patch "statefulset/world-${role}" --type=strategic -p '{"spec":{"template":{"spec":{"containers":[{"name":"worldserver","imagePullPolicy":"IfNotPresent"}]}}}}'
          kubectl -n "$ns" rollout status "statefulset/world-${role}" --timeout=300s
        done
        kubectl -n "$ns" delete secret ghcr-pull --ignore-not-found
        kubectl -n "$ns" get pods -o wide
        not_ready=$(kubectl -n "$ns" get pods --no-headers | awk '$2 != "1/1" || $3 != "Running" { print }')
        if [ -n "$not_ready" ]; then
          echo "$not_ready" >&2
          exit 1
        fi

    - name: ccache stats
      if: always()
      shell: bash
      run: ccache --show-stats || true

    - name: Upload CMake diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ubuntu-cmake-diagnostics
        path: |
          ${{ env.BUILD_DIR }}/CMakeCache.txt
          ${{ env.BUILD_DIR }}/CMakeFiles/CMake*.log
