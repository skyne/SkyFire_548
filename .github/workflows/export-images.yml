# Pull the private GHCR images with this job's token and publish them as an
# artifact. The laptop can download that artifact and load it into k3s without
# a Tailscale auth key.

name: export-images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to export (12-character commit sha). Empty uses the selected ref.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: read

env:
  OWNER: skyne

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set image tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_SHA:0:12}"
          fi
          if ! [[ "$tag" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "Image tag must be a commit sha, got: ${tag}" >&2
            exit 1
          fi
          echo "IMAGE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "Exporting images tagged ${tag}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Save the images
        shell: bash
        run: |
          set -euo pipefail
          images=()
          for target in authserver worldserver clustergateway; do
            image="ghcr.io/${OWNER}/skyfire-${target}:${IMAGE_TAG}"
            docker pull "$image"
            images+=("$image")
          done
          docker save -o "$RUNNER_TEMP/skyfire-images.tar" "${images[@]}"

      - name: Upload the image archive
        uses: actions/upload-artifact@v4
        with:
          name: skyfire-images
          path: ${{ runner.temp }}/skyfire-images.tar
          retention-days: 1
          compression-level: 1
