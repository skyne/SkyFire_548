# Build authserver, worldserver, and clustergateway, push them to GHCR, and roll
# the skyfire namespace onto the new images.
#
# Deploy reaches the cluster over Tailscale. Add these before turning it on:
#   secret  TAILSCALE_AUTHKEY   reusable, ephemeral auth key for the tailnet
#   secret  KUBECONFIG          contents of the k3s kubeconfig (server must be the Tailscale API address)
#   variable SKYFIRE_DEPLOY     set to true to roll out on every push to main
#
# A manual run can deploy without that variable. Packages are made public so the
# node can pull ghcr.io/<owner>/skyfire-*:548 without a registry secret.

name: images

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Roll the new images onto the skyfire cluster
        type: boolean
        default: true
  push:
    branches: [main, trunk]
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "dep/**"
      - "deploy/docker/**"
      - ".github/workflows/images.yml"

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BOOST_VERSION: 1.91.0
  OPENSSL_VERSION: 4.0.0
  DEPS_DIR: ${{ github.workspace }}/.deps
  BOOST_ROOT: ${{ github.workspace }}/.deps/boost_1_91_0
  OPENSSL_ROOT_DIR: ${{ github.workspace }}/.deps/openssl-4.0.0
  BUILD_DIR: ${{ github.workspace }}/build/ubuntu
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CC: gcc-14
  CXX: g++-14
  IMAGE_TAG: "548"

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write

    outputs:
      owner: ${{ steps.names.outputs.owner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ca-certificates ccache cmake git \
            libbz2-dev libreadline-dev ninja-build perl pkg-config wget zlib1g-dev
          sudo apt-get install -y default-libmysqlclient-dev || sudo apt-get install -y libmysqlclient-dev

      - name: Cache Boost
        id: boost-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: ubuntu-boost-${{ env.BOOST_VERSION }}

      - name: Install Boost
        if: steps.boost-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEPS_DIR"
          wget -q "https://archives.boost.io/release/$BOOST_VERSION/source/boost_1_91_0.tar.gz" -O "$RUNNER_TEMP/boost.tar.gz"
          tar -xzf "$RUNNER_TEMP/boost.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/boost_1_91_0"
          ./bootstrap.sh
          ./b2 install --prefix="$BOOST_ROOT" --with-headers -j"$(nproc)"

      - name: Cache OpenSSL
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL_ROOT_DIR }}
          key: ubuntu-openssl-${{ env.OPENSSL_VERSION }}

      - name: Install OpenSSL
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEPS_DIR"
          wget -q "https://www.openssl.org/source/openssl-$OPENSSL_VERSION.tar.gz" -O "$RUNNER_TEMP/openssl.tar.gz"
          tar -xzf "$RUNNER_TEMP/openssl.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-$OPENSSL_VERSION"
          ./Configure linux-x86_64 --prefix="$OPENSSL_ROOT_DIR" --openssldir="$OPENSSL_ROOT_DIR/ssl" shared enable-legacy
          make -j"$(nproc)"
          make install_sw install_ssldirs

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: images-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            images-ccache-${{ github.ref_name }}-
            images-ccache-

      - name: Build servers
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$GITHUB_WORKSPACE" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DTOOLS=OFF \
            -DUSE_COREPCH=ON \
            -DUSE_SCRIPTPCH=ON \
            -DSKYFIRE_BUILD_TESTS=OFF \
            -DBOOST_ROOT="$BOOST_ROOT" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"
          cmake --build "$BUILD_DIR" --parallel "$(nproc)" --target authserver worldserver clustergateway

      - name: Stage image root
        shell: bash
        run: |
          BUILD="$BUILD_DIR" OPENSSL="$OPENSSL_ROOT_DIR" bash deploy/docker/stage-image.sh

      - name: Image names
        id: names
        shell: bash
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ steps.names.outputs.owner }}"
          for target in authserver worldserver clustergateway; do
            image="ghcr.io/${owner}/skyfire-${target}:${IMAGE_TAG}"
            docker build -f deploy/docker/Dockerfile --target "$target" -t "$image" .
            docker push "$image"
          done

      - name: Make packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ steps.names.outputs.owner }}"
          for target in authserver worldserver clustergateway; do
            pkg="skyfire-${target}"
            if gh api --method PUT "/user/packages/container/${pkg}/visibility" -f visibility=public; then
              continue
            fi
            gh api --method PUT "/orgs/${owner}/packages/container/${pkg}/visibility" -f visibility=public
          done

  deploy:
    needs: publish
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      (github.event_name == 'push' && vars.SKYFIRE_DEPLOY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install kubectl
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Write kubeconfig
        shell: bash
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBECONFIG_CONTENT" ]; then
            echo "Add the KUBECONFIG secret (the k3s kubeconfig that uses the Tailscale API address)." >&2
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Roll the realm onto the published images
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ needs.publish.outputs.owner }}"
          ns=skyfire
          tag="${IMAGE_TAG}"

          roll_deploy() {
            local name="$1"
            local image="ghcr.io/${owner}/skyfire-${name}:${tag}"
            kubectl -n "$ns" set image "deploy/${name}" "${name}=${image}"
            kubectl -n "$ns" patch "deploy/${name}" --type=strategic \
              -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"${name}\",\"imagePullPolicy\":\"Always\"}]}}}}"
            kubectl -n "$ns" rollout restart "deploy/${name}"
          }

          roll_world() {
            local role="$1"
            local image="ghcr.io/${owner}/skyfire-worldserver:${tag}"
            kubectl -n "$ns" set image "statefulset/world-${role}" "worldserver=${image}"
            kubectl -n "$ns" patch "statefulset/world-${role}" --type=strategic \
              -p '{"spec":{"template":{"spec":{"containers":[{"name":"worldserver","imagePullPolicy":"Always"}]}}}}'
            kubectl -n "$ns" rollout restart "statefulset/world-${role}"
          }

          roll_deploy authserver
          roll_deploy clustergateway
          for role in oldworld outland northrend pandaria bg; do
            roll_world "$role"
          done

          kubectl -n "$ns" rollout status deploy/authserver --timeout=180s
          kubectl -n "$ns" rollout status deploy/clustergateway --timeout=180s
          for role in oldworld outland northrend pandaria bg; do
            kubectl -n "$ns" rollout status "statefulset/world-${role}" --timeout=300s
          done
