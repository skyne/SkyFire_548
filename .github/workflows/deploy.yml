# Load the already published ghcr.io images onto the k3s node and roll the realm.
# The packages are private, and the node has no registry login, so this job pulls
# them with the workflow token and imports them into containerd before the rollout.
# A busy auth, gateway, or world process is left running until its sockets close.

name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE_TAG: "548"
  OWNER: skyne

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published images
        shell: bash
        run: |
          set -euo pipefail
          for target in authserver worldserver clustergateway; do
            docker pull "ghcr.io/${OWNER}/skyfire-${target}:${IMAGE_TAG}"
          done

      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install kubectl
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Write kubeconfig
        shell: bash
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBECONFIG_CONTENT" ]; then
            echo "KUBECONFIG secret is empty" >&2
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Import images into the node
        shell: bash
        run: |
          set -euo pipefail
          ns=skyfire
          kubectl -n "$ns" delete pod image-loader --ignore-not-found --wait=true
          kubectl -n "$ns" apply -f deploy/k8s/image-loader.yaml
          kubectl -n "$ns" wait --for=condition=Ready pod/image-loader --timeout=180s
          k3s_bin=$(kubectl -n "$ns" exec image-loader -- chroot /host sh -c 'for p in /usr/local/bin/k3s /usr/bin/k3s /bin/k3s; do [ -x "$p" ] && echo "$p" && exit 0; done; exit 1')
          echo "importing with ${k3s_bin}"
          docker save \
            "ghcr.io/${OWNER}/skyfire-authserver:${IMAGE_TAG}" \
            "ghcr.io/${OWNER}/skyfire-worldserver:${IMAGE_TAG}" \
            "ghcr.io/${OWNER}/skyfire-clustergateway:${IMAGE_TAG}" \
            | kubectl -n "$ns" exec -i image-loader -- chroot /host "$k3s_bin" ctr -n k8s.io images import -
          kubectl -n "$ns" delete pod image-loader --wait=false

      - name: Roll the realm
        shell: bash
        run: |
          set -euo pipefail
          owner="${OWNER}"
          ns=skyfire
          tag="${IMAGE_TAG}"

          pod_busy() {
            local pod="$1" hex="$2"
            kubectl -n "$ns" exec "$pod" -- awk -v p="$hex" '
              NR > 1 {
                n = split($2, a, ":")
                if (n >= 2 && toupper(a[2]) == p && $4 == "01") found = 1
              }
              END { exit !found }
            ' /proc/net/tcp /proc/net/tcp6 || return 1
          }

          retire_when_idle() {
            local pod="$1" hex="$2"
            local i=0
            while pod_busy "$pod" "$hex"; do
              i=$((i + 1))
              if [ "$i" -ge 60 ]; then
                echo "$pod still has players; leaving it running"
                return 0
              fi
              sleep 10
            done
            kubectl -n "$ns" delete pod "$pod" --wait=false
            echo "drained $pod"
          }

          roll_front() {
            local name="$1" port="$2"
            local image="ghcr.io/${owner}/skyfire-${name}:${tag}"
            local hex
            hex=$(printf '%04X' "$port")

            kubectl -n "$ns" get pods -l "app=${name}-draining" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | while read -r old; do
              [ -n "$old" ] || continue
              retire_when_idle "$old" "$hex"
            done

            drain=$(printf '%s' "hex=\$(printf %04X ${port}); while awk -v p=\"\$hex\" 'NR>1 { split(\$2,a,\":\"); if (toupper(a[2])==toupper(p) && \$4==\"01\") e=1 } END { exit !e }' /proc/net/tcp /proc/net/tcp6; do sleep 5; done")
            NAME="$name" IMAGE="$image" DRAIN="$drain" python3 -c 'import json,os; print(json.dumps({"spec":{"minReadySeconds":600,"progressDeadlineSeconds":86400,"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}},"template":{"spec":{"terminationGracePeriodSeconds":86400,"containers":[{"name":os.environ["NAME"],"image":os.environ["IMAGE"],"imagePullPolicy":"IfNotPresent","lifecycle":{"preStop":{"exec":{"command":["bash","-c",os.environ["DRAIN"]]}}}}]}}}}))' > /tmp/front-patch.json
            kubectl -n "$ns" patch "deploy/${name}" --type=strategic --patch-file /tmp/front-patch.json

            local deadline=$((SECONDS + 900))
            local fresh=""
            while [ "$SECONDS" -lt "$deadline" ]; do
              fresh=$(kubectl -n "$ns" get pods -l "app=${name}" -o jsonpath="{range .items[?(@.status.containerStatuses[0].ready)]}{.metadata.name}{' '}{.spec.containers[0].image}{'\n'}{end}" | awk -v image="$image" '$2==image { print $1; exit }')
              if [ -n "$fresh" ]; then
                break
              fi
              sleep 5
            done
            if [ -z "$fresh" ]; then
              echo "new ${name} pod did not become ready" >&2
              kubectl -n "$ns" get pods -l "app=${name}" -o wide >&2 || true
              kubectl -n "$ns" describe "deploy/${name}" >&2 | tail -n 40 || true
              exit 1
            fi
            kubectl -n "$ns" rollout pause "deploy/${name}" || true

            kubectl -n "$ns" get pods -l "app=${name}" -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.containers[0].image}{"\n"}{end}' | while read -r pod image_now; do
              [ "$image_now" = "$image" ] && continue
              kubectl -n "$ns" patch pod "$pod" --type=json -p='[{"op":"remove","path":"/metadata/ownerReferences"}]' || true
              kubectl -n "$ns" label pod "$pod" "app=${name}-draining" --overwrite
              retire_when_idle "$pod" "$hex"
            done
            kubectl -n "$ns" rollout resume "deploy/${name}" || true
          }

          roll_world() {
            local role="$1"
            local image="ghcr.io/${owner}/skyfire-worldserver:${tag}"
            local pod="world-${role}-0"
            if pod_busy "$pod" "1F96"; then
              echo "world-${role} has players connected; keeping the current process"
              return 0
            fi
            kubectl -n "$ns" set image "statefulset/world-${role}" "worldserver=${image}"
            kubectl -n "$ns" patch "statefulset/world-${role}" --type=strategic \
              -p '{"spec":{"template":{"spec":{"terminationGracePeriodSeconds":86400,"containers":[{"name":"worldserver","imagePullPolicy":"IfNotPresent"}]}}}}'
            kubectl -n "$ns" rollout status "statefulset/world-${role}" --timeout=300s
          }

          roll_front authserver 3724
          roll_front clustergateway 8085
          for role in oldworld outland northrend pandaria bg; do
            roll_world "$role"
          done
          kubectl -n "$ns" get pods -o wide
