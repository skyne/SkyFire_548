# Roll the skyfire namespace onto the images already published at ghcr.io.
# The packages are private. The node pulls them with this job's token, which is
# removed after the new pods are up. A busy auth, gateway, or world process stays
# up until its sockets close.

name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE_TAG: "548"
  OWNER: skyne

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Resolve the API host
        shell: bash
        run: |
          set -euo pipefail
          ip=""
          for _ in $(seq 1 20); do
            ip=$(tailscale status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); peers=(d.get("Peer") or {}).values(); print(next((p["TailscaleIPs"][0] for p in peers if "ailab" in (((p.get("DNSName") or "")+" "+(p.get("HostName") or "")).lower()) and p.get("TailscaleIPs")), ""))' || true)
            if [ -n "$ip" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$ip" ]; then
            echo "ailab is not visible on the tailnet" >&2
            tailscale status >&2 || true
            exit 1
          fi
          grep -q 'ailab.tail0b303.ts.net' /etc/hosts || echo "$ip ailab.tail0b303.ts.net" | sudo tee -a /etc/hosts >/dev/null
          getent hosts ailab.tail0b303.ts.net

      - name: Install kubectl
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Write kubeconfig
        shell: bash
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBECONFIG_CONTENT" ]; then
            echo "KUBECONFIG secret is empty" >&2
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Give the node a pull secret
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          kubectl -n skyfire delete pod image-loader --ignore-not-found --wait=false
          kubectl -n skyfire create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="$GH_ACTOR" \
            --docker-password="$GH_TOKEN" \
            --dry-run=client -o yaml | kubectl -n skyfire apply -f -
          # The same :548 tag is already cached, and it is the build that exits
          # while loading the legacy provider. Drop it so the pull is not skipped.
          kubectl -n skyfire delete pod image-loader --ignore-not-found --wait=true
          python3 -c 'open("/tmp/loader.yaml","w").write("apiVersion: v1\nkind: Pod\nmetadata:\n  name: image-loader\n  namespace: skyfire\nspec:\n  restartPolicy: Never\n  hostPID: true\n  containers:\n    - name: loader\n      image: busybox:1.36.1\n      command: [\"sleep\", \"180\"]\n      securityContext:\n        privileged: true\n      volumeMounts:\n        - name: host\n          mountPath: /host\n  volumes:\n    - name: host\n      hostPath:\n        path: /\n")'
          kubectl -n skyfire apply -f /tmp/loader.yaml
          kubectl -n skyfire wait --for=condition=Ready pod/image-loader --timeout=180s
          for target in authserver worldserver clustergateway; do
            kubectl -n skyfire exec image-loader -- chroot /host /usr/local/bin/k3s ctr -n k8s.io images rm "ghcr.io/${OWNER}/skyfire-${target}:${IMAGE_TAG}" || true
          done
          kubectl -n skyfire delete pod image-loader --wait=false

      - name: Roll the realm
        shell: bash
        run: |
          set -euo pipefail
          owner="${OWNER}"
          ns=skyfire
          tag="${IMAGE_TAG}"

          pod_busy() {
            local pod="$1" hex="$2"
            kubectl -n "$ns" exec "$pod" -- awk -v p="$hex" '
              NR > 1 {
                n = split($2, a, ":")
                if (n >= 2 && toupper(a[2]) == p && $4 == "01") found = 1
              }
              END { exit !found }
            ' /proc/net/tcp /proc/net/tcp6 || return 1
          }

          retire_when_idle() {
            local pod="$1" hex="$2"
            local i=0
            while pod_busy "$pod" "$hex"; do
              i=$((i + 1))
              if [ "$i" -ge 60 ]; then
                echo "$pod still has players; leaving it running"
                return 0
              fi
              sleep 10
            done
            kubectl -n "$ns" delete pod "$pod" --wait=false
            echo "drained $pod"
          }

          roll_front() {
            local name="$1" port="$2"
            local image="ghcr.io/${owner}/skyfire-${name}:${tag}"
            local hex
            hex=$(printf '%04X' "$port")

            kubectl -n "$ns" rollout resume "deploy/${name}" || true
            kubectl -n "$ns" get pods -l "app=${name}-draining" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | while read -r old; do
              [ -n "$old" ] || continue
              retire_when_idle "$old" "$hex"
            done

            drain=$(printf '%s' "hex=\$(printf %04X ${port}); while awk -v p=\"\$hex\" 'NR>1 { split(\$2,a,\":\"); if (toupper(a[2])==toupper(p) && \$4==\"01\") e=1 } END { exit !e }' /proc/net/tcp /proc/net/tcp6; do sleep 5; done")
            NAME="$name" IMAGE="$image" DRAIN="$drain" python3 -c 'import json,os; print(json.dumps({"spec":{"minReadySeconds":600,"progressDeadlineSeconds":86400,"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}},"template":{"spec":{"terminationGracePeriodSeconds":86400,"imagePullSecrets":[{"name":"ghcr-pull"}],"containers":[{"name":os.environ["NAME"],"image":os.environ["IMAGE"],"imagePullPolicy":"Always","lifecycle":{"preStop":{"exec":{"command":["bash","-c",os.environ["DRAIN"]]}}}}]}}}}))' > /tmp/front-patch.json
            kubectl -n "$ns" patch "deploy/${name}" --type=strategic --patch-file /tmp/front-patch.json

            local deadline=$((SECONDS + 900))
            local fresh=""
            while [ "$SECONDS" -lt "$deadline" ]; do
              fresh=$(kubectl -n "$ns" get pods -l "app=${name}" -o jsonpath="{range .items[?(@.status.containerStatuses[0].ready)]}{.metadata.name}{' '}{.spec.containers[0].image}{'\n'}{end}" | awk -v image="$image" '$2==image { print $1; exit }')
              if [ -n "$fresh" ]; then
                break
              fi
              sleep 5
            done
            if [ -z "$fresh" ]; then
              echo "new ${name} pod did not become ready" >&2
              kubectl -n "$ns" get pods -l "app=${name}" -o wide >&2 || true
              kubectl -n "$ns" describe "deploy/${name}" >&2 | tail -n 40 || true
              exit 1
            fi
            kubectl -n "$ns" rollout pause "deploy/${name}" || true

            kubectl -n "$ns" get pods -l "app=${name}" -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.containers[0].image}{"\n"}{end}' | while read -r pod image_now; do
              [ "$image_now" = "$image" ] && continue
              kubectl -n "$ns" patch pod "$pod" --type=json -p='[{"op":"remove","path":"/metadata/ownerReferences"}]' || true
              kubectl -n "$ns" label pod "$pod" "app=${name}-draining" --overwrite
              retire_when_idle "$pod" "$hex"
            done
            kubectl -n "$ns" rollout resume "deploy/${name}" || true
          }

          roll_world() {
            local role="$1"
            local image="ghcr.io/${owner}/skyfire-worldserver:${tag}"
            local pod="world-${role}-0"
            if pod_busy "$pod" "1F96"; then
              echo "world-${role} has players connected; keeping the current process"
              return 0
            fi
            kubectl -n "$ns" set image "statefulset/world-${role}" "worldserver=${image}"
            kubectl -n "$ns" patch "statefulset/world-${role}" --type=strategic \
              -p '{"spec":{"template":{"spec":{"terminationGracePeriodSeconds":86400,"imagePullSecrets":[{"name":"ghcr-pull"}],"containers":[{"name":"worldserver","imagePullPolicy":"Always"}]}}}}'
            kubectl -n "$ns" rollout status "statefulset/world-${role}" --timeout=300s
          }

          roll_front authserver 3724
          roll_front clustergateway 8085
          for role in oldworld outland northrend pandaria bg; do
            roll_world "$role"
          done
          # The pull token dies with this job. Keep the image that is already on
          # the node, and do not ask the registry again on the next restart.
          for name in authserver clustergateway; do
            kubectl -n "$ns" patch "deploy/${name}" --type=strategic -p "{\"spec\":{\"minReadySeconds\":0,\"template\":{\"spec\":{\"containers\":[{\"name\":\"${name}\",\"imagePullPolicy\":\"IfNotPresent\"}]}}}}"
            kubectl -n "$ns" rollout status "deploy/${name}" --timeout=300s
          done
          for role in oldworld outland northrend pandaria bg; do
            kubectl -n "$ns" patch "statefulset/world-${role}" --type=strategic -p '{"spec":{"template":{"spec":{"containers":[{"name":"worldserver","imagePullPolicy":"IfNotPresent"}]}}}}'
            kubectl -n "$ns" rollout status "statefulset/world-${role}" --timeout=300s
          done
          kubectl -n "$ns" delete secret ghcr-pull --ignore-not-found
          kubectl -n "$ns" get pods -o wide
          not_ready=$(kubectl -n "$ns" get pods --no-headers | awk '$2 != "1/1" || $3 != "Running" { print }')
          if [ -n "$not_ready" ]; then
            echo "$not_ready" >&2
            exit 1
          fi
